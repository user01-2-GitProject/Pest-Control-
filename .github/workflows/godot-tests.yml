name: Godot tests

on:
  pull_request:
  push:
    branches: [main]

env:
  GODOT_VERSION: "4.7"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot
        run: |
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Import project
        run: |
          godot --headless --import 2>&1 | tee import.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" import.log

      - name: Sim tests
        run: godot --headless -s res://tests/test_sim.gd

      - name: Main scene smoke test
        run: |
          godot --headless -s res://tests/smoke_main.gd 2>&1 | tee smoke.log
          grep -q "smoke_main: passed" smoke.log
          ! grep -E "SCRIPT ERROR|Parse Error" smoke.log
